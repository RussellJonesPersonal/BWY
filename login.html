<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in - The British Wheel of Yoga</title>
    <!-- Google font  -->
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <!-- Swiper js  -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css?v=5" />
    <!-- Boostrap cdn  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css?v=5" rel="stylesheet" />
    <!-- Custom style  -->
    <link href="css/style.css?v=5" rel="stylesheet" />
    <script>
      document.documentElement.classList.add("page-loading");
    </script>

    <link rel="icon" href="favico.png" sizes="any" />
    <link rel="icon" type="image/png" href="favico.png" />
  </head>
  <body>
    <main>
      <!-- Navbar  -->
      <!-- This loads /partials/nav.html, and the js/navigation.js file adds .active classes to the defined section and page -->
      <div data-component="main-nav" data-section="" data-page=""></div>

      <section class="content-section">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
              <div class="mb-4 text-center">
                <h1 class="h2 mb-2">Log in to your account</h1>
                <p class="text-muted mb-0">Access your BWY member account.</p>
              </div>
              <div class="bg-light rounded-2 p-4 p-md-5">
                <form action="#" method="post">
                  <div class="mb-4">
                    <label for="login-username" class="form-label fw-semibold"> Member number or email address </label>

                    <input
                      type="text"
                      class="form-control form-control-lg"
                      id="login-username"
                      name="username"
                      autocomplete="username"
                      required
                    />
                  </div>

                  <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-baseline gap-3">
                      <label for="login-password" class="form-label fw-semibold"> Password </label>

                      <a href="forgot-password.html" class="small"> Forgot password? </a>
                    </div>

                    <input
                      type="password"
                      class="form-control form-control-lg"
                      id="login-password"
                      name="password"
                      autocomplete="current-password"
                      required
                    />
                  </div>

                  <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Log in</button>
                  </div>

                  <hr class="my-4" />

                  <p class="mb-0 text-center">
                    Don’t have an account?
                    <a href="register.html" class="fw-semibold">Sign up</a>
                  </p>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer  -->
    <div data-component="site-footer"></div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/announcements.js"></script>
    <script src="js/yoga.js"></script>

    <!-- Icons  -->
    <script src="https://code.iconify.design/3/3.1.1/iconify.min.js"></script>
  </body>
</html>
